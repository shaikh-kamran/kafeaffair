<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Kafe Affair | Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #3e2723, #1b1b1b);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 25px;
            border-radius: 8px;
            min-width: 90px;
        }

        .time-box span {
            display: block;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .time-box small {
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Kafe Affair</h1>
        <p>Coming Soon</p>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <small>DAYS</small>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <small>HOURS</small>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <small>MINUTES</small>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <small>SECONDS</small>
            </div>
        </div>
    </div>

    <script>
        function getISTTime() {
            const now = new Date();
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            return new Date(utc + 5.5 * 60 * 60 * 1000);
        }

        const targetDateIST = new Date("2026-02-12T10:00:00+05:30");

        function updateCountdown() {
            const nowIST = getISTTime();
            const diff = targetDateIST - nowIST;

            if (diff <= 0) {
                document.querySelector(".countdown").innerHTML =
                    "<h2>We Are Live ☕</h2>";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("days").textContent = String(days).padStart(2, "0");
            document.getElementById("hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>

</html>
